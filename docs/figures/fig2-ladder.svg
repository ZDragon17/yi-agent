<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="Helvetica,Arial,sans-serif"><rect width="920" height="420" fill="white"/><text x="460" y="26" text-anchor="middle" font-size="17" font-weight="bold">Fig. 2  Versioned learning ladder driven by falsification experiments</text><line x1="60" y1="360" x2="880" y2="360" stroke="#333" stroke-width="1.5"/><rect x="82" y="320" width="16" height="40" fill="#1f6feb" opacity="0.45"/><text x="90" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v3-v8</text><text x="90" y="384" text-anchor="middle" font-size="9.5" fill="#333">delayed feedback</text><text x="90" y="397" text-anchor="middle" font-size="9.5" fill="#333">&amp; confounder attribution</text><rect x="170" y="286" width="16" height="74" fill="#1f6feb" opacity="0.65"/><text x="178" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v11</text><text x="178" y="384" text-anchor="middle" font-size="9.5" fill="#333">ordered history</text><text x="178" y="397" text-anchor="middle" font-size="9.5" fill="#333">accumulator</text><rect x="258" y="252" width="16" height="108" fill="#1f6feb" opacity="0.8500000000000001"/><text x="266" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v12-v14</text><text x="266" y="384" text-anchor="middle" font-size="9.5" fill="#333">bounded planning</text><text x="266" y="397" text-anchor="middle" font-size="9.5" fill="#333">&amp; information value</text><rect x="346" y="320" width="16" height="40" fill="#1f6feb" opacity="0.45"/><text x="354" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v15</text><text x="354" y="384" text-anchor="middle" font-size="9.5" fill="#333">periodic revalidation</text><rect x="434" y="286" width="16" height="74" fill="#1f6feb" opacity="0.65"/><text x="442" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v16-v18</text><text x="442" y="384" text-anchor="middle" font-size="9.5" fill="#333">recursive/tree planning</text><rect x="522" y="252" width="16" height="108" fill="#1f6feb" opacity="0.8500000000000001"/><text x="530" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v21-v24</text><text x="530" y="384" text-anchor="middle" font-size="9.5" fill="#333">capacity &amp;</text><text x="530" y="397" text-anchor="middle" font-size="9.5" fill="#333">eviction economics</text><rect x="610" y="320" width="16" height="40" fill="#1f6feb" opacity="0.45"/><text x="618" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v25</text><text x="618" y="384" text-anchor="middle" font-size="9.5" fill="#333">multi-scale context</text><rect x="698" y="286" width="16" height="74" fill="#1f6feb" opacity="0.65"/><text x="706" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v26</text><text x="706" y="384" text-anchor="middle" font-size="9.5" fill="#333">long-window context</text><rect x="786" y="252" width="16" height="108" fill="#1f6feb" opacity="0.8500000000000001"/><text x="794" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">v27</text><text x="794" y="384" text-anchor="middle" font-size="9.5" fill="#333">revalidation belief</text><text x="794" y="397" text-anchor="middle" font-size="9.5" fill="#333">gate</text><text x="460" y="414" text-anchor="middle" font-size="11" fill="#555">each step gated: old ledgers replay under their historical semantics; unknown versions fail closed</text></svg>
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-windows:
    name: full test (Windows, Node 22)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      YI_AGENT_TEST_GATE_TIMEOUT_MS: 4800000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare plain temporary directory
        env:
          TMPDIR: ${{ runner.temp }}/yi-agent/ci-temp
          TMP: ${{ runner.temp }}/yi-agent/ci-temp
          TEMP: ${{ runner.temp }}/yi-agent/ci-temp
        run: >-
          node -e "require('node:fs').mkdirSync(require('node:os').tmpdir(), {
          recursive: true })"
      - name: Run full test gate
        env:
          TMPDIR: ${{ runner.temp }}/yi-agent/ci-temp
          TMP: ${{ runner.temp }}/yi-agent/ci-temp
          TEMP: ${{ runner.temp }}/yi-agent/ci-temp
        run: npm test

  compatibility-ubuntu:
    name: compatibility test (Ubuntu, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YI_AGENT_TEST_GATE_TIMEOUT_MS: 2400000
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare plain temporary directory
        env:
          TMPDIR: ${{ runner.temp }}/yi-agent/ci-temp
          TMP: ${{ runner.temp }}/yi-agent/ci-temp
          TEMP: ${{ runner.temp }}/yi-agent/ci-temp
        run: >-
          node -e "require('node:fs').mkdirSync(require('node:os').tmpdir(), {
          recursive: true })"
      - name: Run compatibility test gate
        env:
          TMPDIR: ${{ runner.temp }}/yi-agent/ci-temp
          TMP: ${{ runner.temp }}/yi-agent/ci-temp
          TEMP: ${{ runner.temp }}/yi-agent/ci-temp
        run: >-
          npm run test:gate --
          test/api
          test/agent
          test/application
          test/runtime
          test/e2e/api-cli.test.mjs
          test/e2e/agent-cli.test.mjs
          test/e2e/packaged-cli.test.mjs
